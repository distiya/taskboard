<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>

<body class="auth-page">

<div class="auth-card">

    <div class="auth-logo">S</div>

    <h2>Welcome Back</h2>
    <p class="auth-subtitle">Sign in to continue to your account.</p>

    <!-- Spring Security Error -->
    <div class="auth-alert error" th:if="${param.error}">
        Invalid email or password.
    </div>

    <!-- Logout Success -->
    <div class="auth-alert success" th:if="${param.logout}">
        You have been successfully logged out.
    </div>

    <!-- Registration Success -->
    <div class="auth-alert success" th:if="${param.registered}">
        Account created successfully. Please log in.
    </div>

    <form th:action="@{/login}" method="post">

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="username" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="auth-remember">
            <label>
                <input type="checkbox" name="remember-me">
                Remember Me
            </label>
            <a th:href="@{/forgot-password}">Forgot Password?</a>
        </div>

        <button class="auth-btn" type="submit">Sign In</button>

    </form>

    <div class="auth-link">
        Don't have an account?
        <a th:href="@{/signup}">Create one here</a>
    </div>

</div>

</body>
</html>
