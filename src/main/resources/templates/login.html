<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#2563eb,#7c3aed,#0ea5e9);
            overflow:hidden;
        }

        body::before,
        body::after{
            content:"";
            position:absolute;
            border-radius:50%;
            filter:blur(60px);
            opacity:.45;
            animation:float 8s ease-in-out infinite;
        }

        body::before{
            width:300px;
            height:300px;
            background:white;
            top:-100px;
            left:-100px;
        }

        body::after{
            width:350px;
            height:350px;
            background:#38bdf8;
            right:-120px;
            bottom:-120px;
            animation-delay:2s;
        }

        @keyframes float{
            50%{
                transform:translateY(30px) translateX(20px);
            }
        }

        .card{

            width:420px;
            max-width:92%;
            padding:45px;

            border-radius:25px;

            background:rgba(255,255,255,.15);
            backdrop-filter:blur(20px);

            border:1px solid rgba(255,255,255,.2);

            box-shadow:0 20px 60px rgba(0,0,0,.25);

            color:white;
        }

        .logo{

            width:75px;
            height:75px;

            margin:0 auto 20px;

            border-radius:50%;
            background:white;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:32px;
            font-weight:bold;
            color:#2563eb;
        }

        h2{
            text-align:center;
            margin-bottom:10px;
            font-size:30px;
        }

        .subtitle{
            text-align:center;
            color:rgba(255,255,255,.85);
            margin-bottom:35px;
        }

        .form-group{
            margin-bottom:22px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
        }

        input{

            width:100%;
            padding:15px;

            border:none;
            outline:none;

            border-radius:12px;

            background:rgba(255,255,255,.18);

            color:white;

            font-size:15px;

            transition:.3s;
        }

        input::placeholder{
            color:rgba(255,255,255,.75);
        }

        input:focus{

            background:rgba(255,255,255,.25);

            transform:translateY(-2px);

            box-shadow:0 0 0 2px rgba(255,255,255,.4);

        }

        .remember{

            display:flex;
            justify-content:space-between;
            align-items:center;

            margin-bottom:25px;

            font-size:14px;
        }

        .remember label{
            display:flex;
            align-items:center;
            gap:8px;
            margin:0;
        }

        .remember input{
            width:auto;
        }

        .remember a{

            color:white;
            text-decoration:none;
        }

        .remember a:hover{
            text-decoration:underline;
        }

        .btn{

            width:100%;
            padding:15px;

            border:none;

            border-radius:12px;

            background:white;

            color:#2563eb;

            font-size:16px;
            font-weight:600;

            cursor:pointer;

            transition:.3s;
        }

        .btn:hover{

            transform:translateY(-3px);

            box-shadow:0 15px 35px rgba(0,0,0,.3);

        }

        .signup{

            margin-top:30px;
            text-align:center;

            color:rgba(255,255,255,.85);
        }

        .signup a{

            color:white;

            text-decoration:none;

            font-weight:600;
        }

        .signup a:hover{
            text-decoration:underline;
        }

        .alert{

            margin-bottom:20px;

            padding:12px;

            border-radius:10px;

            text-align:center;
        }

        .error{
            background:rgba(255,0,0,.18);
            color:#ffeaea;
        }

        .success{
            background:rgba(0,200,100,.18);
            color:#e8fff1;
        }

        @media(max-width:480px){

            .card{
                padding:30px;
            }

            h2{
                font-size:26px;
            }

        }

    </style>

</head>

<body>

<div class="card">

    <div class="logo">
        S
    </div>

    <h2>Welcome Back</h2>

    <p class="subtitle">
        Sign in to continue to your account.
    </p>

    <!-- Spring Security Error -->
    <div class="alert error"
         th:if="${param.error}">
        Invalid email or password.
    </div>

    <!-- Logout Success -->
    <div class="alert success"
         th:if="${param.logout}">
        You have been successfully logged out.
    </div>

    <!-- Registration Success -->
    <div class="alert success"
         th:if="${param.registered}">
        Account created successfully. Please log in.
    </div>

    <form th:action="@{/login}" method="post">

        <div class="form-group">

            <label>Email Address</label>

            <input
                    type="email"
                    name="username"
                    placeholder="john@example.com"
                    required>

        </div>

        <div class="form-group">

            <label>Password</label>

            <input
                    type="password"
                    name="password"
                    placeholder="••••••••"
                    required>

        </div>

        <div class="remember">

            <label>
                <input type="checkbox" name="remember-me">
                Remember Me
            </label>

            <a th:href="@{/forgot-password}">
                Forgot Password?
            </a>

        </div>

        <button class="btn" type="submit">
            Sign In
        </button>

    </form>

    <div class="signup">

        Don't have an account?

        <a th:href="@{/signup}">
            Create one here
        </a>

    </div>

</div>

</body>
</html>
