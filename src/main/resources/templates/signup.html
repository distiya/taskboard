<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>

<body class="auth-page">

<div class="auth-card">

    <div class="auth-logo">S</div>

    <h2>Create Account</h2>
    <p class="auth-subtitle">Join us today and start your journey.</p>

    <!-- Error Message -->
    <div class="auth-alert error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/signup}" th:object="${signupDto}" method="post">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" th:field="*{name}" placeholder="John Doe" required>
            <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" th:field="*{email}" placeholder="john@example.com" required>
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" th:field="*{password}" placeholder="••••••••" required>
            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <button class="auth-btn" type="submit">Create Account</button>

    </form>

    <div class="auth-link">
        Already have an account?
        <a th:href="@{/login}">Sign In</a>
    </div>

</div>

</body>
</html>
