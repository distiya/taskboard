<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#2563eb,#7c3aed,#0ea5e9);
            overflow:hidden;
        }

        /* Animated background circles */

        body::before,
        body::after{
            content:"";
            position:absolute;
            border-radius:50%;
            filter:blur(50px);
            opacity:.45;
            animation:float 8s ease-in-out infinite;
        }

        body::before{
            width:280px;
            height:280px;
            background:#ffffff;
            top:-80px;
            left:-80px;
        }

        body::after{
            width:350px;
            height:350px;
            background:#38bdf8;
            bottom:-120px;
            right:-120px;
            animation-delay:2s;
        }

        @keyframes float{
            50%{
                transform:translateY(30px) translateX(20px);
            }
        }

        .card{
            width:420px;
            max-width:92%;
            background:rgba(255,255,255,.15);
            backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,.25);
            border-radius:25px;
            padding:45px;
            color:white;
            box-shadow:0 20px 60px rgba(0,0,0,.25);
        }

        .logo{
            width:75px;
            height:75px;
            margin:0 auto 20px;
            background:white;
            color:#2563eb;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:30px;
            font-weight:bold;
        }

        h2{
            text-align:center;
            margin-bottom:10px;
            font-size:30px;
        }

        .subtitle{
            text-align:center;
            margin-bottom:35px;
            color:rgba(255,255,255,.8);
            font-size:15px;
        }

        .form-group{
            margin-bottom:22px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
            color:rgba(255,255,255,.9);
        }

        input{
            width:100%;
            padding:15px;
            border:none;
            outline:none;
            border-radius:12px;
            background:rgba(255,255,255,.18);
            color:white;
            font-size:15px;
            transition:.3s;
            border:1px solid transparent;
        }

        input::placeholder{
            color:rgba(255,255,255,.7);
        }

        input:focus{
            background:rgba(255,255,255,.25);
            border-color:white;
            transform:translateY(-2px);
        }

        .btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            background:white;
            color:#2563eb;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
            margin-top:10px;
        }

        .btn:hover{
            transform:translateY(-3px);
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }

        .login-link{
            margin-top:30px;
            text-align:center;
            color:rgba(255,255,255,.85);
        }

        .login-link a{
            color:white;
            font-weight:600;
            text-decoration:none;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

        .error{
            color:#ffe5e5;
            background:rgba(255,0,0,.15);
            padding:10px;
            border-radius:10px;
            margin-bottom:20px;
        }

        @media(max-width:480px){

            .card{
                padding:30px;
            }

            h2{
                font-size:26px;
            }
        }
    </style>

</head>

<body>

<div class="card">

    <div class="logo">S</div>

    <h2>Create Account</h2>
    <p class="subtitle">
        Join us today and start your journey.
    </p>

    <!-- Optional Success Message -->
    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/signup}" th:object="${signupDto}" method="post">

        <div class="form-group">
            <label>Full Name</label>
            <input
                    type="text"
                    th:field="*{name}"
                    placeholder="John Doe"
                    required>
            <div th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}">
            </div>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input
                    type="email"
                    th:field="*{email}"
                    placeholder="john@example.com"
                    required>
            <div th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                    type="password"
                    th:field="*{password}"
                    placeholder="••••••••"
                    required>
            <div th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}">
            </div>
        </div>

        <button class="btn" type="submit">
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a th:href="@{/login}">
            Sign In
        </a>
    </div>

</div>

</body>
</html>
